name: WhatsApp Training Notifications

on:
  schedule:
    # Horários ajustados para minutos "quebrados" para evitar atrasos do GitHub (fila de espera)
    # Domingo 03:37 BRT (Treino Longo)
    - cron: '37 3 * * 0'
    # Domingo 19:42 BRT (Weekly preview)
    - cron: '42 19 * * 0'
    # Terça e Quinta 12:23 BRT (Treinos da semana)
    - cron: '23 12 * * 2,4'
  workflow_dispatch: # Permite rodar manualmente para teste

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Send WhatsApp Notification
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/whatsapp_notifier.py
