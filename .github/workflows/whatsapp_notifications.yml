name: WhatsApp Training Notifications

on:
  schedule:
    # 04:00 BRT (Domingo) = 07:00 UTC
    - cron: '0 7 * * 0'
    # 09:00 BRT (Segunda - Pós Sync) = 12:00 UTC
    - cron: '0 12 * * 1'
    # 15:00 BRT (Terça e Quinta) = 18:00 UTC
    - cron: '0 18 * * 2,4'
  workflow_dispatch: # Permite rodar manualmente para teste

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send WhatsApp Notification
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: python scripts/whatsapp_notifier.py
