name: WhatsApp Training Notifications

on:
  schedule:
    # 04:00 BRT (Domingo) = 07:00 UTC (Early enough)
    - cron: '0 7 * * 0'
    # 08:30 BRT (Segunda) = 11:30 UTC (Buffer for weekly sync)
    - cron: '30 11 * * 1'
    # 13:00 BRT (Terça e Quinta) = 16:00 UTC (2h buffer to arrive by 15:00)
    - cron: '0 16 * * 2,4'
  workflow_dispatch: # Permite rodar manualmente para teste

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Send WhatsApp Notification
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/whatsapp_notifier.py
