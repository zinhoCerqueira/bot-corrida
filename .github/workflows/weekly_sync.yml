name: Sincronização Semanal de Treino

on:
  schedule:
    # Roda toda segunda-feira às 04:00 AM UTC
    - cron: '0 4 * * 1'
  push:
    branches:
      - main
    paths:
      - 'Plano_Treino_2026.md'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar script de sincronização
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_to_sheets.py
